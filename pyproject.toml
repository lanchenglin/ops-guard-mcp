[build-system]
requires = ["setuptools>=82", "wheel>=0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-guard-mcp"
version = "0.2.2"
description = "Security-first MCP gateway and remote execution agent for AI-assisted operations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ops Guard MCP contributors" }]
keywords = ["mcp", "ssh", "operations", "security", "approval", "dingtalk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Topic :: Security",
]
dependencies = [
  "mcp>=2.0.0,<3",
]

[project.optional-dependencies]
dingtalk = [
  "dingtalk-stream>=0.20,<0.25",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.9",
  "mypy>=1.14",
]

[project.scripts]
ops-guard = "ops_guard.cli:main"
ops-guard-mcp = "ops_guard.mcp_server:main"
ops-guard-daemon = "ops_guard.daemon:main"
ops-guard-agent = "ops_guard.agent:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "E501", # long regex/rule tables are clearer when kept together
  "S108", # /tmp is an explicit constrained work root in examples and defaults
  "S310", # DingTalk URL is administrator configuration and uses a bounded timeout
  "S603", # all subprocess calls use structured argv and shell=False
  "S607", # executable trust is enforced by Agent/runtime configuration
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
