[agent]
host_id = "prod-web-01"
secret_env = "OPS_GUARD_AGENT_SECRET"
secret_file = "/etc/ops-guard/agent.secret"
nonce_db = "/var/lib/ops-guard/nonces.sqlite3"
allowed_read_roots = ["/var/log/nginx", "/var/log/app"]
allowed_workdirs = ["/tmp/ops-guard"]
default_workdir = "/tmp/ops-guard"
allow_scripts = false
trusted_executable_dirs = ["/usr/local/sbin", "/usr/local/bin", "/usr/sbin", "/usr/bin", "/sbin", "/bin"]
max_timeout_seconds = 60
max_output_bytes = 1048576

[agent.script_interpreters]
shell = ["/bin/bash", "--noprofile", "--norc"]
python = ["/usr/bin/python3", "-I", "-B"]
